<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Pipeline — Calm Your Mind Co</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --accent: #c8f55a;
    --accent-dim: rgba(200,245,90,0.1);
    --text: #f0f0f0;
    --muted: #555;
    --danger: #ff4d4d;
    --warn: #f5a623;
    --success: #4dff91;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 24px 16px 80px;
  }

  header {
    margin-bottom: 32px;
  }

  .brand {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
  }

  h1 span { color: var(--accent); }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    display: block;
  }

  .stat-label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .add-btn {
    width: 100%;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    margin-bottom: 16px;
    transition: opacity 0.15s;
  }

  .add-btn:active { opacity: 0.8; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    padding: 20px 16px;
    overflow-y: auto;
  }

  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
  }

  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  select option { background: #111; }
  textarea { resize: vertical; min-height: 70px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-save {
    flex: 1;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-cancel {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  /* Filter tabs */
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }

  .card:active { border-color: var(--accent); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .card-handle {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .card-platform {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-badge {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .status-contacted { background: rgba(245,166,35,0.15); color: var(--warn); border: 1px solid rgba(245,166,35,0.3); }
  .status-replied { background: rgba(77,255,145,0.1); color: var(--success); border: 1px solid rgba(77,255,145,0.2); }
  .status-negotiating { background: rgba(200,245,90,0.1); color: var(--accent); border: 1px solid rgba(200,245,90,0.2); }
  .status-live { background: rgba(77,255,145,0.2); color: var(--success); border: 1px solid rgba(77,255,145,0.4); }
  .status-pass { background: rgba(255,77,77,0.1); color: var(--danger); border: 1px solid rgba(255,77,77,0.2); }
  .status-followup { background: rgba(150,100,255,0.15); color: #b388ff; border: 1px solid rgba(150,100,255,0.3); }

  .card-meta {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .card-notes {
    font-size: 11px;
    color: #777;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    margin-top: 6px;
    line-height: 1.5;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .card-btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .card-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }

  .empty strong {
    display: block;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    color: #444;
    margin-bottom: 8px;
  }

  .follow-up-alert {
    background: rgba(200,245,90,0.06);
    border: 1px solid rgba(200,245,90,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 16px;
    display: none;
  }

  .follow-up-alert.visible { display: block; }
</style>
</head>
<body>

<header>
  <div class="brand">Calm Your Mind Co</div>
  <h1>Creator <span>Pipeline</span></h1>
</header>

<div class="stats-row">
  <div class="stat"><span class="stat-num" id="stat-total">0</span><div class="stat-label">Total</div></div>
  <div class="stat"><span class="stat-num" id="stat-contacted">0</span><div class="stat-label">Contacted</div></div>
  <div class="stat"><span class="stat-num" id="stat-replied">0</span><div class="stat-label">Replied</div></div>
  <div class="stat"><span class="stat-num" id="stat-live">0</span><div class="stat-label">Live</div></div>
</div>

<div class="follow-up-alert" id="followup-alert"></div>

<button class="add-btn" onclick="openModal()">+ Add Creator</button>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('contacted', this)">Contacted</button>
  <button class="filter-btn" onclick="setFilter('replied', this)">Replied</button>
  <button class="filter-btn" onclick="setFilter('negotiating', this)">Negotiating</button>
  <button class="filter-btn" onclick="setFilter('live', this)">Live</button>
  <button class="filter-btn" onclick="setFilter('followup', this)">Follow Up</button>
  <button class="filter-btn" onclick="setFilter('pass', this)">Pass</button>
</div>

<div class="cards" id="cards"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add Creator</h2>
    <div class="field">
      <label>Handle</label>
      <input id="f-handle" placeholder="@username" />
    </div>
    <div class="field">
      <label>Name</label>
      <input id="f-name" placeholder="Full name" />
    </div>
    <div class="field">
      <label>Platform</label>
      <select id="f-platform">
        <option value="Instagram">Instagram</option>
        <option value="TikTok">TikTok</option>
        <option value="Both">Both</option>
        <option value="YouTube">YouTube</option>
      </select>
    </div>
    <div class="field">
      <label>Followers</label>
      <input id="f-followers" placeholder="e.g. 52.7K" />
    </div>
    <div class="field">
      <label>Email</label>
      <input id="f-email" placeholder="contact@email.com" />
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="contacted">Contacted</option>
        <option value="replied">Replied</option>
        <option value="negotiating">Negotiating</option>
        <option value="followup">Follow Up</option>
        <option value="live">Live</option>
        <option value="pass">Pass</option>
      </select>
    </div>
    <div class="field">
      <label>Date Contacted</label>
      <input id="f-date" type="date" />
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Manager info, deal details, anything relevant..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveCreator()">Save</button>
    </div>
  </div>
</div>

<script>
  let creators = JSON.parse(localStorage.getItem('creators') || '[]');
  let editingId = null;
  let currentFilter = 'all';

  // Pre-load your existing outreach
  if (creators.length === 0) {
    const today = new Date().toISOString().split('T')[0];
    creators = [
      { id: uid(), handle: '@caitlynbayybee', name: 'Caitlyn', platform: 'Instagram', followers: '44.1K', email: '', status: 'contacted', date: today, notes: 'Emailed — waiting on reply' },
      { id: uid(), handle: '@abifeltham', name: 'Abi', platform: 'TikTok', followers: '68.7K', email: '', status: 'contacted', date: today, notes: 'Emailed — waiting on reply' },
      { id: uid(), handle: '@happiestsober', name: 'Madeline', platform: 'Instagram', followers: '70.7K', email: 'michael@alignedsocial.net', status: 'contacted', date: today, notes: 'Has manager — forward to michael@alignedsocial.net' },
      { id: uid(), handle: '@noboozebabes', name: 'Shea Gomez', platform: 'Instagram', followers: '52.7K', email: 'hello@noboozebabes.com', status: 'contacted', date: today, notes: 'Operator-level creator. Also runs The Drī Edit newsletter. Has done brand deals before.' },
    ];
    save();
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
  function save() { localStorage.setItem('creators', JSON.stringify(creators)); }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const list = currentFilter === 'all' ? creators : creators.filter(c => c.status === currentFilter);
    const el = document.getElementById('cards');

    // Stats
    document.getElementById('stat-total').textContent = creators.length;
    document.getElementById('stat-contacted').textContent = creators.filter(c => c.status === 'contacted').length;
    document.getElementById('stat-replied').textContent = creators.filter(c => c.status === 'replied' || c.status === 'negotiating').length;
    document.getElementById('stat-live').textContent = creators.filter(c => c.status === 'live').length;

    // Follow-up alert
    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
    const due = creators.filter(c => c.status === 'contacted' && new Date(c.date) <= sevenDaysAgo);
    const alert = document.getElementById('followup-alert');
    if (due.length > 0) {
      alert.textContent = `⚡ ${due.length} creator${due.length > 1 ? 's' : ''} need a follow-up — contacted 7+ days ago`;
      alert.classList.add('visible');
    } else {
      alert.classList.remove('visible');
    }

    if (list.length === 0) {
      el.innerHTML = `<div class="empty"><strong>Nothing here yet</strong>Add creators to start tracking your pipeline.</div>`;
      return;
    }

    el.innerHTML = list.map(c => `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-handle">${c.handle}</div>
            <div class="card-platform">${c.name ? c.name + ' · ' : ''}${c.platform}</div>
          </div>
          <span class="status-badge status-${c.status}">${c.status}</span>
        </div>
        <div class="card-meta">
          ${c.followers ? `<span>👥 ${c.followers}</span>` : ''}
          ${c.email ? `<span>✉️ ${c.email}</span>` : ''}
          ${c.date ? `<span>📅 ${c.date}</span>` : ''}
        </div>
        ${c.notes ? `<div class="card-notes">${c.notes}</div>` : ''}
        <div class="card-actions">
          <div class="card-btn" onclick="editCreator('${c.id}')">Edit</div>
          <div class="card-btn" onclick="cycleStatus('${c.id}')">Update Status</div>
          <div class="card-btn danger" onclick="deleteCreator('${c.id}')">Remove</div>
        </div>
      </div>
    `).join('');
  }

  function openModal(id = null) {
    editingId = id;
    const m = document.getElementById('modal');
    document.getElementById('modal-title').textContent = id ? 'Edit Creator' : 'Add Creator';
    if (id) {
      const c = creators.find(x => x.id === id);
      document.getElementById('f-handle').value = c.handle || '';
      document.getElementById('f-name').value = c.name || '';
      document.getElementById('f-platform').value = c.platform || 'Instagram';
      document.getElementById('f-followers').value = c.followers || '';
      document.getElementById('f-email').value = c.email || '';
      document.getElementById('f-status').value = c.status || 'contacted';
      document.getElementById('f-date').value = c.date || '';
      document.getElementById('f-notes').value = c.notes || '';
    } else {
      document.getElementById('f-handle').value = '';
      document.getElementById('f-name').value = '';
      document.getElementById('f-platform').value = 'Instagram';
      document.getElementById('f-followers').value = '';
      document.getElementById('f-email').value = '';
      document.getElementById('f-status').value = 'contacted';
      document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('f-notes').value = '';
    }
    m.classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    editingId = null;
  }

  function saveCreator() {
    const c = {
      id: editingId || uid(),
      handle: document.getElementById('f-handle').value.trim(),
      name: document.getElementById('f-name').value.trim(),
      platform: document.getElementById('f-platform').value,
      followers: document.getElementById('f-followers').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      status: document.getElementById('f-status').value,
      date: document.getElementById('f-date').value,
      notes: document.getElementById('f-notes').value.trim(),
    };
    if (!c.handle) return;
    if (editingId) {
      creators = creators.map(x => x.id === editingId ? c : x);
    } else {
      creators.push(c);
    }
    save();
    closeModal();
    render();
  }

  function editCreator(id) { openModal(id); }

  function deleteCreator(id) {
    if (!confirm('Remove this creator?')) return;
    creators = creators.filter(c => c.id !== id);
    save();
    render();
  }

  const statusCycle = ['contacted', 'replied', 'negotiating', 'live', 'followup', 'pass'];
  function cycleStatus(id) {
    const c = creators.find(x => x.id === id);
    const idx = statusCycle.indexOf(c.status);
    c.status = statusCycle[(idx + 1) % statusCycle.length];
    save();
    render();
  }

  render();
</script>
</body>
</html>
